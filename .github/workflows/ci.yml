name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: python -c "import open_ai_meter; print(open_ai_meter.__version__)"
      - run: openaimeter --help
      - run: pytest

  quality-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: bandit -q -r src -c pyproject.toml
      - run: pip-audit --local
      - run: python -m build
      - run: twine check dist/*
      - name: Smoke-test wheel installation
        shell: bash
        run: |
          python -m venv /tmp/openaimeter-wheel
          /tmp/openaimeter-wheel/bin/python -m pip install --upgrade pip
          /tmp/openaimeter-wheel/bin/python -m pip install dist/*.whl
          (cd /tmp && /tmp/openaimeter-wheel/bin/python -c \
            "import open_ai_meter; print(open_ai_meter.__version__)")
          (cd /tmp && /tmp/openaimeter-wheel/bin/openaimeter --help)
